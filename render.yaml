# Create a separate Blueprint in Render for this repository. Never commit secrets.
services:
  - type: web
    name: nexastream-operator-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: TV_API_URL
        fromService:
          name: nexastream-tv
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TV_ADMIN_API_KEY
        fromService:
          name: nexastream-tv
          type: web
          envVarKey: ADMIN_API_KEY
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true